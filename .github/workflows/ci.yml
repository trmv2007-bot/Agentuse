name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q agentuse tests run.py
      - name: Probe contract
        run: python tests/probe_contract_test.py
      - name: Pytest
        run: python -m pytest tests/test_peak.py -q
